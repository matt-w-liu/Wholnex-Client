    <!-- Apply the saved theme before first paint to avoid a light/dark flash. Dark is the brand default. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wholnex-theme');
          var dark =
            stored === 'light'
              ? false
              : stored === 'system'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
